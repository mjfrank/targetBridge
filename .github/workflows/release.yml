name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-sender:
    name: Build Sender (${{ matrix.os }} - ${{ matrix.arch }})
    env:
      TARGETBRIDGE_SIGNING_CONFIGURED: ${{ secrets.TARGETBRIDGE_CODESIGN_P12_BASE64 != '' }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Tools
        run: |
          brew install cmake xcodegen

      - name: Import release signing certificate
        if: ${{ env.TARGETBRIDGE_SIGNING_CONFIGURED == 'true' }}
        uses: ./.github/actions/import-macos-signing-certificate
        with:
          certificate-base64: ${{ secrets.TARGETBRIDGE_CODESIGN_P12_BASE64 }}
          certificate-password: ${{ secrets.TARGETBRIDGE_CODESIGN_P12_PASSWORD }}

      - name: Build Sender App
        run: |
          cd TargetBridge-Sender
          TB_BUILD="$(grep -m1 'CURRENT_PROJECT_VERSION:' project.yml | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          test -n "$TB_BUILD"
          REQUIRE_PERSISTENT_SIGNING=0
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && REQUIRE_PERSISTENT_SIGNING=1
          TB_SENDER_BUILD="$TB_BUILD" TARGETBRIDGE_REQUIRE_PERSISTENT_SIGNING="$REQUIRE_PERSISTENT_SIGNING" ./scripts/build_targetbridge_sender_app.sh
          file ../build/TargetBridge.app/Contents/MacOS/TargetBridge | grep -q "${{ matrix.arch }}"
          file ../build/TargetBridge.app/Contents/PlugIns/TargetBridgeAudio.driver/Contents/MacOS/TargetBridgeAudio | grep -q "${{ matrix.arch }}"

      - name: Zip App Bundle
        run: |
          cd build
          zip -r TargetBridge-${{ matrix.arch }}.app.zip TargetBridge.app

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: build/TargetBridge-${{ matrix.arch }}.app.zip

      - name: Upload Sender Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-${{ matrix.arch }}.app.zip
          path: build/TargetBridge-${{ matrix.arch }}.app.zip
          retention-days: 1

  # Three Receivers, named by processor and lowest supported macOS (see
  # ci.yml). The macOS 10.14 Mojave one uses SDL2 and FFmpeg built from source.
  build-receiver:
    name: Build Receiver (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    env:
      TARGETBRIDGE_SIGNING_CONFIGURED: ${{ secrets.TARGETBRIDGE_CODESIGN_P12_BASE64 != '' }}
      LEGACY_PREFIX: ${{ github.workspace }}/legacy-deps
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64
            label: AppleSilicon-macOS15-Sequoia-and-later
            max_min_os: "15.0"
            legacy: false
          - os: macos-15-intel
            arch: x86_64
            label: Intel-macOS15-Sequoia-and-later
            max_min_os: "15.0"
            legacy: false
          - os: macos-15-intel
            arch: x86_64
            label: Intel-macOS10.14-Mojave-and-later
            max_min_os: "10.14"
            legacy: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        if: ${{ !matrix.legacy }}
        run: |
          brew install ffmpeg sdl2 sdl3 dylibbundler

      - name: Install Build Tools (macOS 10.14 Mojave libraries)
        if: ${{ matrix.legacy }}
        run: |
          brew install pkgconf nasm cmake jq dylibbundler

      - name: Cache Libraries (macOS 10.14 Mojave)
        if: ${{ matrix.legacy }}
        id: cache
        uses: actions/cache@v4
        with:
          path: legacy-deps
          key: legacy-deps-10.14-sdl2-2.30.9-ffmpeg-7.1-${{ hashFiles('TargetBridge-Receiver/scripts/build_legacy_deps.sh') }}

      - name: Build SDL2 and FFmpeg for macOS 10.14 Mojave
        if: ${{ matrix.legacy && steps.cache.outputs.cache-hit != 'true' }}
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.14"
        run: |
          bash TargetBridge-Receiver/scripts/build_legacy_deps.sh "$LEGACY_PREFIX"

      - name: Import release signing certificate
        if: ${{ env.TARGETBRIDGE_SIGNING_CONFIGURED == 'true' }}
        uses: ./.github/actions/import-macos-signing-certificate
        with:
          certificate-base64: ${{ secrets.TARGETBRIDGE_CODESIGN_P12_BASE64 }}
          certificate-password: ${{ secrets.TARGETBRIDGE_CODESIGN_P12_PASSWORD }}

      - name: Build Receiver App
        env:
          TARGETBRIDGE_RECEIVER_MAX_MIN_OS: ${{ matrix.max_min_os }}
        run: |
          if [[ "${{ matrix.legacy }}" == "true" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.14
            export PKG_CONFIG_PATH="$LEGACY_PREFIX/lib/pkgconfig"
            export DYLD_FALLBACK_LIBRARY_PATH="$LEGACY_PREFIX/lib"
            export TARGETBRIDGE_LIBRARY_DIR="$LEGACY_PREFIX/lib"
            export CFLAGS=-Werror=unguarded-availability-new
          fi
          cd TargetBridge-Receiver
          TB_BUILD="$(grep -m1 'CURRENT_PROJECT_VERSION:' ../TargetBridge-Sender/project.yml | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          test -n "$TB_BUILD"
          REQUIRE_PERSISTENT_SIGNING=0
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && REQUIRE_PERSISTENT_SIGNING=1
          APP_BUILD="$TB_BUILD" TARGETBRIDGE_REQUIRE_PERSISTENT_SIGNING="$REQUIRE_PERSISTENT_SIGNING" ./scripts/build_tbreceiver_c_app.sh

      - name: Zip App Bundle
        run: |
          cd build
          zip -ry TargetBridge-Receiver-${{ matrix.label }}.app.zip "TargetBridge Receiver.app"

      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: build/TargetBridge-Receiver-${{ matrix.label }}.app.zip

      - name: Upload Receiver Artifact
        uses: actions/upload-artifact@v7
        with:
          name: TargetBridge-Receiver-${{ matrix.label }}.app.zip
          path: build/TargetBridge-Receiver-${{ matrix.label }}.app.zip
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-sender, build-receiver]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download Sender Artifact
        uses: actions/download-artifact@v8
        with:
          name: TargetBridge-x86_64.app.zip
          path: ./artifacts

      - name: Download Sender Artifact (arm64)
        uses: actions/download-artifact@v8
        with:
          name: TargetBridge-arm64.app.zip
          path: ./artifacts

      - name: Download Receiver Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: TargetBridge-Receiver-*.app.zip
          path: ./artifacts
          merge-multiple: true

      - name: Create Draft Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            ./artifacts/TargetBridge-x86_64.app.zip \
            ./artifacts/TargetBridge-arm64.app.zip \
            ./artifacts/TargetBridge-Receiver-AppleSilicon-macOS15-Sequoia-and-later.app.zip \
            ./artifacts/TargetBridge-Receiver-Intel-macOS15-Sequoia-and-later.app.zip \
            ./artifacts/TargetBridge-Receiver-Intel-macOS10.14-Mojave-and-later.app.zip \
            --title "TargetBridge ${{ github.ref_name }}" \
            --draft \
            --generate-notes
